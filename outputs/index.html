<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7ead9"><title>星星收集社</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap');
:root{--ink:#4c3d54;--pink:#ef9daf;--cream:#fff8ed;--lav:#d9c9f4}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f7ead9;color:var(--ink);font-family:Nunito,'Noto Sans TC',sans-serif;display:grid;place-items:center;padding:18px;overflow-x:hidden;overflow-y:auto}.sky{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 15% 16%,#fff8e2 0 9%,transparent 35%),radial-gradient(ellipse at 88% 79%,#e6dcf7 0 9%,transparent 34%),linear-gradient(145deg,#f7ead9,#f6e3df 55%,#eee5f4)}.app{position:relative;width:min(100%,470px);min-height:min(760px,calc(100svh - 36px));background:rgba(255,250,241,.87);border:2px solid #fff;border-radius:34px;box-shadow:0 22px 60px #79596a26;overflow:hidden;display:flex;flex-direction:column}.top{padding:24px 25px 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:13px;letter-spacing:.16em;font-weight:900;color:#a27b93}.sound{border:0;background:#f4e8ef;border-radius:50%;width:38px;height:38px;font-size:17px;cursor:pointer}.heading{text-align:center;padding:4px 18px 14px}.heading h1{font-size:clamp(30px,8vw,43px);line-height:1.15;margin:4px 0 7px;letter-spacing:.02em}.heading p{font-size:14px;margin:0;color:#8b7b89}.stats{display:flex;gap:10px;padding:0 22px 14px}.stat{flex:1;text-align:center;border-radius:18px;padding:10px 5px;background:#fff;border:1px solid #f3e9e5}.stat small{display:block;font-size:10px;letter-spacing:.13em;color:#ad9aa7;font-weight:900}.stat b{font-size:24px;line-height:1.3}.arena{position:relative;flex:1;min-height:300px;margin:0 16px;border-radius:25px;overflow:hidden;background:linear-gradient(180deg,#e6f2eb,#f4eee4);border:2px solid #fff;touch-action:manipulation}.arena:before,.arena:after{content:'☁';position:absolute;color:#ffffff9e;font-size:80px;left:8%;top:11%;transform:rotate(-8deg);pointer-events:none}.arena:after{font-size:60px;left:auto;right:9%;top:32%;transform:rotate(8deg)}.ground{position:absolute;bottom:-34px;left:-8%;width:116%;height:95px;border-radius:50% 50% 0 0;background:#c8dfc5;pointer-events:none}.ground:after{content:'✿   ·   ✿       ·      ✿';position:absolute;top:22px;left:12%;font-size:17px;color:#8fb68e;letter-spacing:8px}.orb{position:absolute;z-index:2;border:0;background:transparent;padding:0;cursor:pointer;line-height:1;filter:drop-shadow(0 7px 5px #86678222);animation:bob 1.8s ease-in-out infinite;touch-action:manipulation}.orb span{display:block;transition:transform .12s}.orb:hover span{transform:scale(1.18) rotate(9deg)}.orb.pop{animation:pop .22s forwards!important;pointer-events:none}@keyframes bob{50%{transform:translateY(-9px) rotate(5deg)}}@keyframes pop{to{transform:scale(1.7);opacity:0}}.overlay{position:absolute;z-index:5;inset:0;display:grid;place-items:center;background:#fff8edb8;backdrop-filter:blur(3px);padding:24px;text-align:center}.overlay.hidden{display:none}.card{max-width:280px}.hero{font-size:56px;display:block;margin-bottom:4px;animation:bob 2s infinite}.card h2{font-size:25px;margin:6px 0}.card p{font-size:14px;line-height:1.75;color:#817281;margin:8px 0 19px}.btn{border:0;border-radius:999px;background:#e98fa4;color:white;padding:14px 31px;font:900 16px inherit;font-family:inherit;font-size:16px;font-weight:900;box-shadow:0 5px 0 #d47b91;cursor:pointer;transition:transform .1s}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d47b91}.footer{padding:14px 20px 19px;text-align:center;font-size:11px;letter-spacing:.04em;color:#ab9aa5}.toast{position:absolute;z-index:4;top:15px;left:50%;transform:translate(-50%,-12px);opacity:0;background:#fff;border-radius:99px;padding:8px 13px;font-size:13px;font-weight:900;box-shadow:0 4px 18px #72546922;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.orb:focus-visible,.btn:focus-visible,.sound:focus-visible{outline:3px solid #785e96;outline-offset:4px}.sound[aria-pressed="false"]{opacity:.7}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body><div class="sky"></div><main class="app"><header class="top"><div class="brand">✦ LITTLE DAYDREAM ✦</div><button class="sound" id="sound" type="button" aria-label="關閉音效" aria-pressed="true">♪</button></header><section class="heading"><h1>星星收集社</h1><p>趁微風把星星都收進口袋吧</p></section><section class="stats"><div class="stat"><small>星星</small><b id="score" aria-live="polite" aria-atomic="true">0</b></div><div class="stat"><small>剩餘時間</small><b><span id="time">30</span><small style="display:inline;font-size:13px;letter-spacing:0"> 秒</small></b></div><div class="stat"><small>最佳紀錄</small><b id="best">0</b></div></section><section class="arena" id="arena" aria-label="遊戲區"><div class="ground"></div><div class="toast" id="toast">好棒！</div><div class="overlay" id="overlay"><div class="card"><span class="hero" id="hero">🌙</span><h2 id="ovtitle">準備好收集星星了嗎？</h2><p id="ovcopy">點擊或輕觸飄過的小星星，<br>金色星星有雙倍分數喔！<br>鍵盤可用 Tab 選取，再按 Enter。</p><button class="btn" id="start">開始收集</button></div></div></section><footer class="footer">輕輕點一下星星 · 金星 +2 ✨</footer></main>
<script>
const arena=document.querySelector('#arena'), scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay');let score=0,time=30,running=false,spawnTimer,tickTimer,soundOn=true,audio;
function readBest(){try{let value=Number(localStorage.getItem('starBest'));return Number.isFinite(value)&&value>0?value:0}catch{return 0}}
function saveBest(value){try{localStorage.setItem('starBest',String(value))}catch{}}
bestEl.textContent=readBest();
function beep(freq=660,dur=.08){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=freq;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.start();o.stop(audio.currentTime+dur)}catch{}}
function toast(msg){let t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),550)}
function spawn(){if(!running)return;let gold=Math.random()<.2,emojis=gold?['🌟','💫']:['⭐','✨','🌟','💛','🩷','🌼'];let b=document.createElement('button');b.className='orb';b.setAttribute('aria-label',gold?'收集金色星星':'收集星星');b.innerHTML='<span>'+emojis[Math.floor(Math.random()*emojis.length)]+'</span>';let size=gold?48:40;b.style.fontSize=size+'px';b.style.left=(8+Math.random()*77)+'%';b.style.top=(12+Math.random()*64)+'%';b.style.animationDelay=(-Math.random())+'s';b.onclick=()=>{if(!running)return;score+=gold?2:1;scoreEl.textContent=score;beep(gold?940:660);if(score%10===0)toast('太厲害了！連續收集 ✨');b.classList.add('pop');setTimeout(()=>b.remove(),220)};arena.appendChild(b);setTimeout(()=>b.remove(),2400)}
function start(){score=0;time=30;running=true;scoreEl.textContent=0;timeEl.textContent=30;overlay.classList.add('hidden');arena.querySelectorAll('.orb').forEach(x=>x.remove());spawn();spawnTimer=setInterval(spawn,690);tickTimer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish()},1000)}
function finish(){running=false;clearInterval(spawnTimer);clearInterval(tickTimer);arena.querySelectorAll('.orb').forEach(x=>x.remove());let best=readBest();if(score>best){best=score;saveBest(best);bestEl.textContent=best}document.querySelector('#hero').textContent=score>=25?'🏆':'🌙';document.querySelector('#ovtitle').textContent=score>=25?'星星大師！':'今天也收穫滿滿';document.querySelector('#ovcopy').innerHTML=`你收集了 <b>${score}</b> 顆星星<br>${score>0?'再來一局，看看能不能更多？':'下次一定會收集到更多喔！'}`;document.querySelector('#start').textContent='再玩一次';overlay.classList.remove('hidden');beep(520,.15)}
document.querySelector('#start').onclick=start;document.querySelector('#sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'♪':'♫̸';e.currentTarget.setAttribute('aria-pressed',String(soundOn));e.currentTarget.setAttribute('aria-label',soundOn?'關閉音效':'開啟音效');if(soundOn)beep()};
</script></body></html>
